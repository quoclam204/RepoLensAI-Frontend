<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="favicon-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0a1916" />
      <stop offset="100%" stopColor="#040b09" />
    </linearGradient>
    <linearGradient id="favicon-stroke" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#10b981" />
      <stop offset="50%" stopColor="#06b6d4" />
      <stop offset="100%" stopColor="#3b82f6" />
    </linearGradient>
    <radialGradient id="favicon-glow" cx="16" cy="16" r="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00f0ff" stopOpacity="0.5" />
      <stop offset="100%" stopColor="#00f0ff" stopOpacity="0" />
    </radialGradient>
  </defs>

  <!-- Container Base -->
  <rect width="32" height="32" rx="8" fill="url(#favicon-bg)" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />
  <circle cx="16" cy="16" r="8" fill="url(#favicon-glow)" />

  <!-- Outer Hexagonal Frame -->
  <path
    d="M16 4.8L25.5 10.3V21.3L16 26.8L6.5 21.3V10.3L16 4.8Z"
    stroke="url(#favicon-stroke)"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Camera Lens Aperture Blades -->
  <path
    d="M16 4.8V11.5M25.5 10.3L19.5 13.5M25.5 21.3L19.5 18.2M16 26.8V20.2M6.5 21.3L12.5 18.2M6.5 10.3L12.5 13.5"
    stroke="url(#favicon-stroke)"
    stroke-width="1.4"
    stroke-linecap="round"
    stroke-opacity="0.8"
  />

  <!-- Center Aperture Iris Ring -->
  <circle
    cx="16"
    cy="16"
    r="4.4"
    stroke="url(#favicon-stroke)"
    stroke-width="1.6"
  />

  <!-- Center AI Focus Core -->
  <circle
    cx="16"
    cy="16"
    r="1.8"
    fill="#00f0ff"
  />
</svg>
